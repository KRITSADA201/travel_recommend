{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center mt-3">
<div class="col-md-5 col-lg-4">
<div class="card shadow-lg border-0 rounded-4 p-4">

    {% if invalid %}
        <h4 class="text-center fw-bold mb-3"><i class="bi bi-exclamation-triangle text-danger me-2"></i>ลิงก์ไม่ถูกต้อง</h4>
        <p class="text-center text-muted small">ลิงก์รีเซ็ตรหัสผ่านนี้หมดอายุหรือไม่ถูกต้องแล้ว กรุณาขอลิงก์ใหม่อีกครั้ง</p>
        <a href="{{ url_for('auth.forgot_password') }}" class="btn btn-primary w-100 rounded-3 mt-2">
            <i class="bi bi-arrow-repeat me-1"></i>ขอลิงก์ใหม่
        </a>
    {% else %}
        <h4 class="text-center fw-bold mb-4"><i class="bi bi-shield-lock me-2"></i>ตั้งรหัสผ่านใหม่</h4>

        {% if error %}
        <div class="alert alert-danger py-2 text-center small"><i class="bi bi-exclamation-triangle me-1"></i>{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control form-control-lg rounded-end"
                           placeholder="รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="password2" class="form-control form-control-lg rounded-end"
                           placeholder="ยืนยันรหัสผ่านใหม่" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg rounded-3 fw-bold">
                <i class="bi bi-check-circle me-1"></i>บันทึกรหัสผ่านใหม่
            </button>
        </form>
    {% endif %}

</div>
</div>
</div>

{% endblock %}
