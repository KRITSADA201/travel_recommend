{% extends 'base.html' %}
{% block content %}
<meta name="referrer" content="no-referrer">

<div class="row justify-content-center">
<div class="col-lg-8">
<div class="card shadow-sm border-0 p-4" style="border-radius:12px;">
    <div class="d-flex align-items-center mb-4">
        <i class="bi bi-plus-circle-fill text-primary fs-4 me-2"></i>
        <h5 class="fw-bold mb-0">เพิ่มสถานที่ท่องเที่ยว</h5>
    </div>

    <form method="POST" id="place-form">
        <!-- ข้อมูลทั่วไป -->
        <div class="row g-3 mb-3">
            <div class="col-md-8">
                <label class="form-label small fw-semibold">ชื่อสถานที่ <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" placeholder="เช่น วัดพระธาตุพนม, คาเฟ่ริมน้ำ" required>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-semibold">หมวดหมู่</label>
                <select name="category_id" class="form-select">
                    {% for c in categories %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">ที่ตั้ง / ที่อยู่ <span class="text-danger">*</span></label>
            <input type="text" name="location" class="form-control" placeholder="เช่น อ.เมือง จ.อุบลราชธานี" required>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">รายละเอียดสถานที่ <span class="text-danger">*</span></label>
            <textarea name="detail" class="form-control" rows="4" placeholder="กรอกรายละเอียด จุดเด่น หรือข้อมูลที่น่าสนใจของสถานที่..." required></textarea>
        </div>

        <!-- รูปภาพ -->
        <hr class="my-4 text-muted">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
                <h6 class="fw-semibold mb-0"><i class="bi bi-images me-1 text-primary"></i>รูปภาพสถานที่</h6>
                <small class="text-muted">รองรับลิงก์รูปภาพโดยตรง, Google Drive หรือ OneDrive</small>
            </div>
            <button type="button" class="btn btn-outline-primary btn-sm" onclick="addImageRow()">
                <i class="bi bi-plus me-1"></i>เพิ่มช่องรูป
            </button>
        </div>

        <div id="image-list" class="mb-3">
            <div class="image-row row g-2 mb-2 align-items-center">
                <div class="col-7">
                    <input type="text" name="image_urls" class="form-control form-control-sm" placeholder="วาง URL ลิงก์รูปภาพ">
                </div>
                <div class="col-4">
                    <input type="text" name="image_captions" class="form-control form-control-sm" placeholder="คำบรรยายภาพ (ไม่บังคับ)">
                </div>
                <div class="col-1 text-center">
                    <button type="button" class="btn btn-outline-danger btn-sm py-0" onclick="removeRow(this)">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- พิกัดแผนที่ -->
        <hr class="my-4 text-muted">
        <div class="mb-2">
            <h6 class="fw-semibold mb-0 text-primary"><i class="bi bi-geo-alt-fill me-1 text-danger"></i>พิกัดแผนที่ (Google Maps)</h6>
            <small class="text-muted">ค้นหาชื่อสถานที่ หรือกรอกพิกัด Latitude / Longitude เพื่อดูตัวอย่างบน Google Maps</small>
        </div>

        <div class="input-group input-group-sm mb-3">
            <span class="input-group-text bg-light"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="map-search" class="form-control" placeholder="พิมพ์ชื่อสถานที่เพื่อค้นหาพิกัด เช่น วัดสิรินธรวรารามภูพร้าว, ผาแต้ม...">
            <button type="button" class="btn btn-primary" onclick="searchOnMap()">
                <i class="bi bi-search me-1"></i>ค้นหาพิกัด
            </button>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-md-5">
                <label class="form-label small text-muted">Latitude (ละติจูด)</label>
                <input type="text" name="latitude" id="lat-input" class="form-control form-control-sm"
                       placeholder="เช่น 15.244800" oninput="updateGoogleMapFromInput()">
            </div>
            <div class="col-md-5">
                <label class="form-label small text-muted">Longitude (ลองจิจูด)</label>
                <input type="text" name="longitude" id="lng-input" class="form-control form-control-sm"
                       placeholder="เช่น 104.847300" oninput="updateGoogleMapFromInput()">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="button" class="btn btn-outline-success btn-sm w-100" onclick="getMyLocation()" title="ใช้ตำแหน่งปัจจุบันของคุณ">
                    <i class="bi bi-crosshair me-1"></i>พิกัดฉัน
                </button>
            </div>
        </div>

        <!-- Google Maps Embed Live Preview -->
        <div id="add-gmap-wrapper" style="height:290px; border-radius:12px; overflow:hidden;" class="shadow-sm border mb-3">
            <iframe
                id="add-gmap-iframe"
                src="https://maps.google.com/maps?q=15.2448,104.8473&hl=th&z=14&output=embed"
                width="100%"
                height="100%"
                style="border:0;"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>

        <div class="d-flex gap-2 justify-content-end pt-2">
            <a href="{{ url_for('places.list_places') }}" class="btn btn-light btn-sm px-3">ยกเลิก</a>
            <button type="submit" class="btn btn-primary btn-sm px-4 fw-semibold">
                <i class="bi bi-check-circle me-1"></i>บันทึกสถานที่
            </button>
        </div>
    </form>
</div>
</div>
</div>

<script>
function addImageRow() {
    const row = document.createElement('div');
    row.className = 'image-row row g-2 mb-2 align-items-center';
    row.innerHTML = `
        <div class="col-7"><input type="text" name="image_urls" class="form-control form-control-sm" placeholder="URL รูปภาพ"></div>
        <div class="col-4"><input type="text" name="image_captions" class="form-control form-control-sm" placeholder="คำบรรยาย (ไม่บังคับ)"></div>
        <div class="col-1"><button type="button" class="btn btn-outline-danger btn-sm py-0" onclick="removeRow(this)"><i class="bi bi-x"></i></button></div>`;
    document.getElementById('image-list').appendChild(row);
}
function removeRow(btn) {
    const rows = document.querySelectorAll('.image-row');
    if (rows.length > 1) btn.closest('.image-row').remove();
}

function updateGoogleMap(lat, lng) {
    const iframe = document.getElementById('add-gmap-iframe');
    if (iframe && lat && lng) {
        iframe.src = `https://maps.google.com/maps?q=${lat},${lng}&hl=th&z=15&output=embed`;
    }
}

function updateGoogleMapFromInput() {
    const lat = document.getElementById('lat-input').value.trim();
    const lng = document.getElementById('lng-input').value.trim();
    if (lat && lng && !isNaN(lat) && !isNaN(lng)) {
        updateGoogleMap(lat, lng);
    }
}

function getMyLocation() {
    if (!navigator.geolocation) { alert('เบราว์เซอร์ไม่รองรับ GPS'); return; }
    navigator.geolocation.getCurrentPosition(
        p => {
            const lat = p.coords.latitude.toFixed(6);
            const lng = p.coords.longitude.toFixed(6);
            document.getElementById('lat-input').value = lat;
            document.getElementById('lng-input').value = lng;
            updateGoogleMap(lat, lng);
        },
        () => alert('ไม่สามารถดึงตำแหน่งปัจจุบันได้')
    );
}

async function searchOnMap() {
    const rawQ = document.getElementById('map-search').value.trim();
    if (!rawQ) return;

    const btn = document.querySelector('button[onclick="searchOnMap()"]');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>ค้นหา...'; }

    const queries = [
        rawQ,
        rawQ + ' อุบลราชธานี',
        rawQ + ' Thailand',
        rawQ.replace(/ศูนย์บริการ|จุดผ่านแดนถาวร|จุดผ่านแดน|ด่านพรมแดน|ด่านตรวจ/g, '').trim(),
        rawQ.split(' ')[0],
        rawQ.split(' ').slice(-1)[0]
    ].filter(q => q && q.length >= 2);

    const uniqueQueries = [...new Set(queries)];
    let found = false;

    for (const q of uniqueQueries) {
        try {
            const resp = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&accept-language=th,en`);
            const data = await resp.json();
            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat).toFixed(6);
                const lng = parseFloat(data[0].lon).toFixed(6);
                document.getElementById('lat-input').value = lat;
                document.getElementById('lng-input').value = lng;
                updateGoogleMap(lat, lng);
                found = true;
                break;
            }
        } catch (e) {
            console.error(e);
        }
    }

    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-search me-1"></i>ค้นหาพิกัด'; }

    if (!found) {
        const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(rawQ)}`;
        if (confirm(`ไม่พบพิกัดอัตโนมัติสำหรับ "${rawQ}"\n\nต้องการเปิด Google Maps เพื่อดูและคัดลอกพิกัดมาใส่หรือไม่?`)) {
            window.open(gmapUrl, '_blank');
        }
    }
}
document.getElementById('map-search').addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); searchOnMap(); } });
</script>
{% endblock %}
