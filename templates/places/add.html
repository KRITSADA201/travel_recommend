{% extends 'base.html' %}
{% block content %}
<meta name="referrer" content="no-referrer">

<div class="row justify-content-center">
<div class="col-lg-8">
<div class="card shadow-sm border-0 p-4" style="border-radius:12px;">
    <div class="d-flex align-items-center mb-4">
        <i class="bi bi-plus-circle-fill text-primary fs-4 me-2"></i>
        <h5 class="fw-bold mb-0">เพิ่มสถานที่ท่องเที่ยว</h5>
    </div>

    <form method="POST" id="place-form">
        <!-- ข้อมูลทั่วไป -->
        <div class="row g-3 mb-3">
            <div class="col-md-8">
                <label class="form-label small fw-semibold">ชื่อสถานที่ <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" placeholder="เช่น วัดพระธาตุพนม, คาเฟ่ริมน้ำ" required>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-semibold">หมวดหมู่</label>
                <select name="category_id" class="form-select">
                    {% for c in categories %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">ที่ตั้ง / ที่อยู่ <span class="text-danger">*</span></label>
            <input type="text" name="location" class="form-control" placeholder="เช่น อ.เมือง จ.อุบลราชธานี" required>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">รายละเอียดสถานที่ <span class="text-danger">*</span></label>
            <textarea name="detail" class="form-control" rows="4" placeholder="กรอกรายละเอียด จุดเด่น หรือข้อมูลที่น่าสนใจของสถานที่..." required></textarea>
        </div>

        <!-- รูปภาพ -->
        <hr class="my-4 text-muted">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
                <h6 class="fw-semibold mb-0"><i class="bi bi-images me-1 text-primary"></i>รูปภาพสถานที่</h6>
                <small class="text-muted">รองรับลิงก์รูปภาพโดยตรง, Google Drive หรือ OneDrive</small>
            </div>
            <button type="button" class="btn btn-outline-primary btn-sm" onclick="addImageRow()">
                <i class="bi bi-plus me-1"></i>เพิ่มช่องรูป
            </button>
        </div>

        <div id="image-list" class="mb-3">
            <div class="image-row row g-2 mb-2 align-items-center">
                <div class="col-7">
                    <input type="text" name="image_urls" class="form-control form-control-sm" placeholder="วาง URL ลิงก์รูปภาพ">
                </div>
                <div class="col-4">
                    <input type="text" name="image_captions" class="form-control form-control-sm" placeholder="คำบรรยายภาพ (ไม่บังคับ)">
                </div>
                <div class="col-1 text-center">
                    <button type="button" class="btn btn-outline-danger btn-sm py-0" onclick="removeRow(this)">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- พิกัดแผนที่ -->
        <hr class="my-4 text-muted">
        <div class="mb-2">
            <h6 class="fw-semibold mb-0"><i class="bi bi-pin-map-fill me-1 text-danger"></i>พิกัดแผนที่</h6>
            <small class="text-muted">คลิกบนแผนที่หรือลากหมุดเพื่อเลือกตำแหน่งพิกัด</small>
        </div>

        <div class="row g-2 mb-2">
            <div class="col-md-5">
                <label class="form-label small text-muted">Latitude (ละติจูด)</label>
                <input type="text" name="latitude" id="lat-input" class="form-control form-control-sm"
                       placeholder="เช่น 15.244800" oninput="updateMapFromInput()">
            </div>
            <div class="col-md-5">
                <label class="form-label small text-muted">Longitude (ลองจิจูด)</label>
                <input type="text" name="longitude" id="lng-input" class="form-control form-control-sm"
                       placeholder="เช่น 104.847300" oninput="updateMapFromInput()">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="button" class="btn btn-outline-success btn-sm w-100" onclick="getMyLocation()" title="ใช้ตำแหน่งปัจจุบันของคุณ">
                    <i class="bi bi-crosshair me-1"></i>พิกัดฉัน
                </button>
            </div>
        </div>

        <div class="input-group input-group-sm mb-2">
            <span class="input-group-text bg-light"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="map-search" class="form-control" placeholder="ค้นหาชื่อตำบล อำเภอ หรือสถานที่บนแผนที่...">
            <button type="button" class="btn btn-outline-secondary" onclick="searchOnMap()">ค้นหา</button>
        </div>

        <div id="add-map" style="height:280px;border-radius:10px;z-index:0;" class="shadow-sm mb-3"></div>

        <div class="d-flex gap-2 justify-content-end pt-2">
            <a href="{{ url_for('places.list_places') }}" class="btn btn-light btn-sm px-3">ยกเลิก</a>
            <button type="submit" class="btn btn-primary btn-sm px-4 fw-semibold">
                <i class="bi bi-check-circle me-1"></i>บันทึกสถานที่
            </button>
        </div>
    </form>
</div>
</div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function addImageRow() {
    const row = document.createElement('div');
    row.className = 'image-row row g-2 mb-2 align-items-center';
    row.innerHTML = `
        <div class="col-7"><input type="text" name="image_urls" class="form-control form-control-sm" placeholder="URL รูปภาพ"></div>
        <div class="col-4"><input type="text" name="image_captions" class="form-control form-control-sm" placeholder="คำบรรยาย (ไม่บังคับ)"></div>
        <div class="col-1"><button type="button" class="btn btn-outline-danger btn-sm py-0" onclick="removeRow(this)"><i class="bi bi-x"></i></button></div>`;
    document.getElementById('image-list').appendChild(row);
}
function removeRow(btn) {
    const rows = document.querySelectorAll('.image-row');
    if (rows.length > 1) btn.closest('.image-row').remove();
}

// Map
const map = L.map('add-map').setView([15.2448, 104.8473], 9);
L.tileLayer('/tile/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
}).addTo(map);
let marker = null;

map.on('click', e => setMarker(e.latlng.lat, e.latlng.lng));

function setMarker(lat, lng) {
    if (marker) map.removeLayer(marker);
    marker = L.marker([lat, lng], {draggable: true}).addTo(map);
    marker.on('dragend', e => setInputs(e.target.getLatLng().lat, e.target.getLatLng().lng));
    setInputs(lat, lng);
}
function setInputs(lat, lng) {
    document.getElementById('lat-input').value = lat.toFixed(6);
    document.getElementById('lng-input').value = lng.toFixed(6);
}
function updateMapFromInput() {
    const lat = parseFloat(document.getElementById('lat-input').value);
    const lng = parseFloat(document.getElementById('lng-input').value);
    if (!isNaN(lat) && !isNaN(lng)) { map.setView([lat, lng], 14); setMarker(lat, lng); }
}
function getMyLocation() {
    navigator.geolocation?.getCurrentPosition(
        p => { map.setView([p.coords.latitude, p.coords.longitude], 15); setMarker(p.coords.latitude, p.coords.longitude); },
        () => alert('ไม่สามารถดึงตำแหน่งได้')
    );
}
function searchOnMap() {
    const q = document.getElementById('map-search').value.trim();
    if (!q) return;

    // ค้นหาครั้งแรก
    fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&accept-language=th,en`)
        .then(r => r.json())
        .then(d => {
            if (d.length) {
                map.setView([+d[0].lat, +d[0].lon], 15);
                setMarker(+d[0].lat, +d[0].lon);
            } else {
                // ถ้าหาไม่เจอ ลองเพิ่ม Thailand ต่อท้าย
                return fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q + ' Thailand')}&format=json&limit=1&accept-language=th,en`)
                    .then(r => r.json())
                    .then(d2 => {
                        if (d2.length) {
                            map.setView([+d2[0].lat, +d2[0].lon], 15);
                            setMarker(+d2[0].lat, +d2[0].lon);
                        } else {
                            // ลองค้นเป็นภาษาอังกฤษล้วน
                            return fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&accept-language=en`)
                                .then(r => r.json())
                                .then(d3 => {
                                    if (d3.length) {
                                        map.setView([+d3[0].lat, +d3[0].lon], 15);
                                        setMarker(+d3[0].lat, +d3[0].lon);
                                    } else {
                                        alert('ไม่พบตำแหน่ง "' + q + '"\nลองพิมพ์ชื่อเป็นภาษาอังกฤษ หรือใส่ชื่อจังหวัดต่อท้าย\nเช่น "Godfather Coffee Ubon Ratchathani"');
                                    }
                                });
                        }
                    });
            }
        });
}
document.getElementById('map-search').addEventListener('keypress', e => { if (e.key==='Enter'){e.preventDefault();searchOnMap();} });
</script>
{% endblock %}
